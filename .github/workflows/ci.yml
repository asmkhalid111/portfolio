name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"

      - name: Verify Required Environment Variables
        run: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::Missing required GitHub Actions repository variables: NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            echo "Please configure these variables in GitHub Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Production Build
        run: npm run build

      - name: End-to-End Smoke Tests
        run: npx playwright test tests/e2e/smoke.spec.ts
